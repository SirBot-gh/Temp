name: Test Sanitize-DeviceState

on:
  push:
    paths:
      - 'Sanitize-DeviceState.ps1'
      - 'tests/**'
      - '.github/workflows/test-sanitize-device-state.yml'
  pull_request:
    paths:
      - 'Sanitize-DeviceState.ps1'
      - 'tests/**'
      - '.github/workflows/test-sanitize-device-state.yml'

jobs:
  pwsh-linux:
    name: PowerShell 7 (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PowerShell 7
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https software-properties-common
          source /etc/os-release
          wget -q "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb" -O packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell
      - name: Build tar fixtures from source trees
        shell: bash
        run: |
          cd tests/fixtures
          tar -cf device_state_cfg.tar -C device_state_cfg .
          tar -cf canary_device_state.tar -C canary_device_state .
          tar -czf TESTFW-01_device_state.tgz -C ../../TESTFW-01_device_state .
      - name: Run Sanitize-DeviceState tests
        shell: pwsh
        run: ./tests/Run-Tests.ps1

  windows-ps51:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tar fixtures from source trees
        shell: pwsh
        run: |
          Set-Location tests/fixtures
          tar -cf device_state_cfg.tar -C device_state_cfg .
          tar -cf canary_device_state.tar -C canary_device_state .
          tar -czf TESTFW-01_device_state.tgz -C ../../TESTFW-01_device_state .
      - name: Run Sanitize-DeviceState tests
        shell: powershell
        run: .\tests\Run-Tests.ps1
